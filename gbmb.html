// ─── CONTEXT ──────────────────────────────────────────────────────────────────
const Ctx=createContext(null);
const useApp=()=>useContext(Ctx);

function AppProvider({children}){
  const loadLS=()=>{try{const s=localStorage.getItem('gbmb3');return s?JSON.parse(s):null}catch{return null}};
  const saved=loadLS();
  const [S,setS]=useState(()=>({
    user:null,page:'landing',params:{},obStep:0,obData:{name:'',campus:'',mood:'',genres:[]},
    song:SONGS[0],playing:false,progress:0,volume:.7,
    liked:{songs:[],playlists:[],events:[],artists:[]},
    recent:[3,8,12,1,5],queue:[1,2,3,4,5],showQ:false,notif:null,
    ...(saved||{}),playing:false,notif:null,showQ:false,
  }));

  const set=useCallback(fn=>{
    setS(p=>{
      const n=typeof fn==='function'?fn(p):{...p,...fn};
      const{playing:_p,notif:_n,showQ:_q,...persist}=n;
      try{localStorage.setItem('gbmb3',JSON.stringify(persist))}catch{}
      return n;
    });
  },[]);

  const audioRef=useRef(null);
  if(!audioRef.current){
    audioRef.current=new Audio();
    audioRef.current.preload='metadata';
  }

  // Sync audio source and playback state
  useEffect(()=>{
    const a=audioRef.current;
    if(!a||!S.song)return;
    const src=S.song.audio||`assets/songs/${S.song.title.toLowerCase().replace(/[^a-z0-9]+/g,'-')}.mp3`;
    if(a.getAttribute('data-src')!==src){
      a.setAttribute('data-src',src);
      a.src=src;
      a.load();
    }
    if(S.playing){
      const playPromise=a.play();
      if(playPromise!==undefined){
        playPromise.catch(e=>{
          console.warn('Audio play error / autoplay restriction:',e);
        });
      }
    }else{
      a.pause();
    }
  },[S.song?.id,S.playing]);

  // Volume control
  useEffect(()=>{
    if(audioRef.current){
      audioRef.current.volume=Math.max(0,Math.min(1,S.volume));
    }
  },[S.volume]);

  // Listen to audio timeupdate, loadedmetadata, and ended
  useEffect(()=>{
    const a=audioRef.current;
    if(!a)return;

    const onTimeUpdate=()=>{
      set(p=>{
        const curTime=Math.floor(a.currentTime);
        if(p.progress===curTime)return p;
        return{...p,progress:curTime};
      });
    };

    const onLoadedMetadata=()=>{
      if(a.duration&&!isNaN(a.duration)&&isFinite(a.duration)){
        set(p=>({
          ...p,
          song:p.song?{...p.song,dur:Math.floor(a.duration)}:p.song
        }));
      }
    };

    const onEnded=()=>{
      set(p=>{
        const q=p.queue||[];const i=q.indexOf(p.song?.id);
        const nid=q[i+1]||q[0];
        const next=SONGS.find(s=>s.id===nid)||SONGS[0];
        return{...p,song:next,progress:0,playing:true};
      });
    };

    a.addEventListener('timeupdate',onTimeUpdate);
    a.addEventListener('loadedmetadata',onLoadedMetadata);
    a.addEventListener('ended',onEnded);

    return()=>{
      a.removeEventListener('timeupdate',onTimeUpdate);
      a.removeEventListener('loadedmetadata',onLoadedMetadata);
      a.removeEventListener('ended',onEnded);
    };
  },[set]);

  useEffect(()=>{
    if(S.notif){const t=setTimeout(()=>set(p=>({...p,notif:null})),2800);return()=>clearTimeout(t);}
  },[S.notif]);

  const nav=useCallback((page,params={})=>{set(p=>({...p,page,params}));window.scrollTo(0,0);},[set]);

  const seek=useCallback(val=>{
    if(audioRef.current){
      audioRef.current.currentTime=val;
    }
    set(p=>({...p,progress:val}));
  },[set]);

  const play=useCallback((song,arr)=>{
    set(p=>{
      const isSame=p.song?.id===song.id;
      if(isSame){
        return{...p,playing:!p.playing};
      }
      return{
        ...p,
        song,
        playing:true,
        progress:0,
        queue:arr?arr.map(s=>s.id):p.queue,
        recent:[song.id,...p.recent.filter(i=>i!==song.id)].slice(0,12)
      };
    });
  },[set]);

  const togglePlay=useCallback(()=>{
    set(p=>({...p,playing:!p.playing}));
  },[set]);

  const nextSong=useCallback(()=>set(p=>{
    const q=p.queue||[];const i=q.indexOf(p.song?.id);
    const nid=q[i+1]||q[0];
    return{...p,song:SONGS.find(s=>s.id===nid)||SONGS[0],progress:0,playing:true};
  }),[set]);

  const prevSong=useCallback(()=>set(p=>{
    if(p.progress>5){
      if(audioRef.current)audioRef.current.currentTime=0;
      return{...p,progress:0};
    }
    const q=p.queue||[];const i=q.indexOf(p.song?.id);
    const pid=q[i-1]||q[q.length-1];
    return{...p,song:SONGS.find(s=>s.id===pid)||SONGS[0],progress:0,playing:true};
  }),[set]);

  const like=useCallback((type,id)=>set(p=>{
    const list=p.liked[type]||[];const has=list.includes(id);
    return{...p,liked:{...p.liked,[type]:has?list.filter(x=>x!==id):[...list,id]},
      notif:has?'Removed from favorites':'Added to favorites ❤️'};
  }),[set]);
  const isLiked=useCallback((type,id)=>(S.liked[type]||[]).includes(id),[S.liked]);
  const notify=useCallback(msg=>set(p=>({...p,notif:msg})),[set]);

  return<Ctx.Provider value={{...S,set,nav,play,togglePlay,nextSong,prevSong,like,isLiked,notify,seek}}>{children}</Ctx.Provider>;
}

// ─── PLAYER ───────────────────────────────────────────────────────────────────
function Player(){
  const{song,playing,progress,volume,showQ,queue,set,togglePlay,nextSong,prevSong,like,isLiked,seek,notify}=useApp();
  const[isEditingTime,setIsEditingTime]=useState(false);
  const[timeInput,setTimeInput]=useState('');
  const[draggingVal,setDraggingVal]=useState(null);

  if(!song)return null;
  const lk=isLiked('songs',song.id);
  const dur=song.dur||240;
  const currentPos = draggingVal !== null ? draggingVal : progress;
  const pct=Math.min(100, Math.max(0, (currentPos / (dur || 1)) * 100));
  const qSongs=(queue||[]).map(id=>SONGS.find(s=>s.id===id)).filter(Boolean);
  const posterSrc=song.poster||song.cover;

  // Handle click on progress track
  const handleTrackClick=(e)=>{
    // Ignore clicks if coming from the thumb itself
    const rect=e.currentTarget.getBoundingClientRect();
    const clickX=e.clientX - rect.left;
    const ratio=Math.max(0, Math.min(1, clickX / rect.width));
    const newTargetTime=Math.round(ratio * dur);
    seek(newTargetTime);
  };

  // Manual time input parser and validator
  const handleManualTimeSubmit=(e)=>{
    e.preventDefault();
    const raw=timeInput.trim();
    if(!raw){
      setIsEditingTime(false);
      return;
    }
    let targetSec = 0;
    if(raw.includes(':')){
      const parts=raw.split(':');
      if(parts.length===2){
        const m=parseInt(parts[0],10);
        const s=parseInt(parts[1],10);
        if(!isNaN(m)&&!isNaN(s)&&m>=0&&s>=0&&s<60){
          targetSec = m*60 + s;
        }else{
          notify?.('⚠️ Invalid format. Use MM:SS (e.g. 1:30)');
          setIsEditingTime(false);
          return;
        }
      }else{
        notify?.('⚠️ Invalid format. Use MM:SS (e.g. 1:30)');
        setIsEditingTime(false);
        return;
      }
    }else{
      const s=parseInt(raw,10);
      if(!isNaN(s)&&s>=0){
        targetSec = s;
      }else{
        notify?.('⚠️ Invalid seconds. Enter a positive number');
        setIsEditingTime(false);
        return;
      }
    }

    if(targetSec > dur){
      notify?.(`⚠️ Time exceeds song duration (${fmt(dur)})`);
      targetSec = dur;
    }
    seek(targetSec);
    setIsEditingTime(false);
    setTimeInput('');
  };

  return<>
    {showQ&&<div className="glassd" style={{position:'fixed',right:0,bottom:78,width:296,maxHeight:'56vh',overflowY:'auto',zIndex:49,borderRadius:'16px 0 0 16px'}}>
      <div style={{padding:16}}>
        <div style={{fontWeight:600,fontSize:14,marginBottom:12}}>Up Next</div>
        {qSongs.map(s=><div key={s.id} onClick={()=>set(p=>({...p,song:s,progress:0,playing:true}))}
          style={{display:'flex',alignItems:'center',gap:10,padding:'7px 8px',borderRadius:10,cursor:'pointer',transition:'background .15s',
            background:s.id===song.id?'rgba(139,92,246,.15)':'transparent',color:s.id===song.id?'#A78BFA':'inherit'}}
          onMouseEnter={e=>s.id!==song.id&&(e.currentTarget.style.background='rgba(255,255,255,.05)')}
          onMouseLeave={e=>s.id!==song.id&&(e.currentTarget.style.background='transparent')}>
          <div style={{width:34,height:34,borderRadius:6,overflow:'hidden',flexShrink:0}}><Img src={s.poster||s.cover} alt={s.title}/></div>
          <div style={{minWidth:0}}>
            <div style={{fontSize:13,fontWeight:500,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{s.title}</div>
            <div style={{fontSize:11,color:'rgba(240,240,245,.4)'}}>{s.artist}</div>
          </div>
        </div>)}
      </div>
    </div>}
    <div className="glassd" style={{position:'fixed',bottom:0,left:0,right:0,zIndex:40,borderTop:'1px solid rgba(255,255,255,.06)'}}>
      {/* Interactive Song Progress Track with Drag & Click Seeking */}
      <div 
        onClick={handleTrackClick}
        style={{position:'relative',height:6,cursor:'pointer',background:'rgba(255,255,255,.09)',transition:'height .15s'}}
        onMouseEnter={e=>e.currentTarget.style.height='8px'}
        onMouseLeave={e=>e.currentTarget.style.height='6px'}
        title="Click or drag anywhere to seek"
      >
        <div style={{position:'absolute',top:0,left:0,height:'100%',width:`${pct}%`,background:'linear-gradient(90deg,#8B5CF6,#EC4899)',borderRadius:2,transition:draggingVal!==null?'none':'width .15s linear'}}/>
        <input 
          type="range" 
          min={0} 
          max={dur} 
          value={currentPos} 
          onInput={e=>setDraggingVal(+e.target.value)}
          onChange={e=>{
            const val=+e.target.value;
            setDraggingVal(null);
            seek(val);
          }}
          className="pbar" 
          aria-label="Seek to time" 
          style={{position:'absolute',top:0,left:0,width:'100%',height:'100%',opacity:0,cursor:'pointer',zIndex:2}}
        />
      </div>
      <div style={{display:'flex',alignItems:'center',padding:'10px 16px',gap:12,paddingBottom:'calc(10px + env(safe-area-inset-bottom,0px))'}}>
        <div style={{display:'flex',alignItems:'center',gap:12,flex:1,minWidth:0}}>
          <div style={{width:44,height:44,borderRadius:8,overflow:'hidden',flexShrink:0}}><Img src={posterSrc} alt={song.title}/></div>
          <div style={{minWidth:0}}>
            <div style={{fontSize:14,fontWeight:500,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{song.title}</div>
            <div style={{fontSize:12,color:'rgba(240,240,245,.45)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{song.artist}</div>
          </div>
          <button onClick={()=>like('songs',song.id)} style={{color:lk?'#EC4899':'rgba(240,240,245,.38)',flexShrink:0,background:'none',border:'none',cursor:'pointer',display:'none'}} className="sm:block" aria-label="Like">
            <svg width={17} height={17} viewBox="0 0 24 24" fill={lk?'#EC4899':'none'} stroke={lk?'#EC4899':'currentColor'} strokeWidth="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          </button>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:14}}>
          <button onClick={prevSong} style={{color:'rgba(240,240,245,.55)',background:'none',border:'none',cursor:'pointer',display:'none'}} className="sm:block" aria-label="Previous">
            <svg width={20} height={20} viewBox="0 0 24 24" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" strokeWidth="2" fill="none"/></svg>
          </button>
          <button onClick={togglePlay} className="bp" aria-label={playing?'Pause':'Play'}
            style={{width:40,height:40,borderRadius:'50%',background:'linear-gradient(135deg,#8B5CF6,#EC4899)',display:'flex',alignItems:'center',justifyContent:'center',border:'none',cursor:'pointer',color:'#fff'}}>
            {playing
              ?<svg width={17} height={17} viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
              :<svg width={17} height={17} viewBox="0 0 24 24" fill="currentColor"><path d="M5 3l14 9-14 9V3z"/></svg>}
          </button>
          <button onClick={nextSong} style={{color:'rgba(240,240,245,.55)',background:'none',border:'none',cursor:'pointer'}} aria-label="Next">
            <svg width={20} height={20} viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" strokeWidth="2" fill="none"/></svg>
          </button>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:12,flex:1,justifyContent:'flex-end'}} className="hidden sm:flex">
          {/* Clickable time display with manual time entry popup */}
          {isEditingTime ? (
            <form onSubmit={handleManualTimeSubmit} style={{display:'flex',alignItems:'center',gap:4}}>
              <input 
                type="text" 
                autoFocus 
                placeholder="1:30 or 90" 
                value={timeInput} 
                onChange={e=>setTimeInput(e.target.value)} 
                onBlur={()=>setIsEditingTime(false)}
                style={{width:86,fontSize:12,padding:'4px 8px',borderRadius:6,textAlign:'center'}}
                title="Type time (e.g. 1:30 or 90) and press Enter"
              />
              <button type="submit" style={{background:'#8B5CF6',color:'#fff',fontSize:10,fontWeight:600,padding:'4px 6px',borderRadius:6,border:'none',cursor:'pointer'}}>Go</button>
            </form>
          ) : (
            <span 
              onClick={()=>{setTimeInput(fmt(progress));setIsEditingTime(true);}}
              style={{fontSize:13,color:'rgba(240,240,245,.65)',cursor:'pointer',padding:'3px 8px',borderRadius:6,background:'rgba(255,255,255,.05)',border:'1px solid rgba(255,255,255,.08)',fontWeight:500,transition:'background .15s'}}
              onMouseEnter={e=>e.currentTarget.style.background='rgba(139,92,246,.2)'}
              onMouseLeave={e=>e.currentTarget.style.background='rgba(255,255,255,.05)'}
              title="Click to manually jump to any time (e.g. 1:30 or 90)"
            >
              <span style={{color:'#fff',fontWeight:600}}>{fmt(progress)}</span> / <span>{fmt(dur)}</span>
            </span>
          )}
          <svg width={14} height={14} viewBox="0 0 24 24" fill="none" stroke="rgba(240,240,245,.5)" strokeWidth="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
          <input type="range" min={0} max={1} step={.01} value={volume} onChange={e=>set(p=>({...p,volume:+e.target.value}))} className="vbar" aria-label="Volume"/>
          <button onClick={()=>set(p=>({...p,showQ:!p.showQ}))}
            style={{color:showQ?'#A78BFA':'rgba(240,240,245,.45)',background:'none',border:'none',cursor:'pointer'}} aria-label="Queue">
            <svg width={17} height={17} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          </button>
        </div>
      </div>
    </div>
  </>;
}

function Landing(){
  const{set}=useApp();

      const x=(e.clientX/window.innerWidth-.5)*2;

function Onboarding(){
  const{obStep,obData,set}=useApp();
  const upd=(k,v)=>set(p=>({...p,obData:{...p.obData,[k]:v}}));
  const next=()=>set(p=>({...p,obStep:p.obStep+1}));
  const back=()=>set(p=>({...p,obStep:Math.max(0,p.obStep-1)}));
  const finish=()=>{const{name,campus,mood,genres}=obData;set(p=>({...p,user:{name,campus,mood,genres},page:'home'}));};

          {[['Date & Time',`${dStr} · ${ev.time}`],['Venue',ev.venue],['Entry',`${ev.price} · ${ev.cap} cap.`]].map(([k,v])=><div key={k} className="glass" style={{borderRadius:14,padding:'12px 15px'}}>
            <div style={{fontSize:11,color:'rgba(240,240,245,.35)',marginBottom:4,textTransform:'uppercase',letterSpacing:1}}>{k}</div>
            <div style={{fontSize:13,fontWeight:500}}>{v}</div>
          </div>)}
        </div>
        <p style={{fontSize:14,lineHeight:1.7,color:'rgba(240,240,245,.62)'}}>{ev.desc}</p>
        <div style={{display:'flex',gap:11,marginTop:22}}>
          <button onClick={()=>like('events',ev.id)} className="bp"
            style={{flex:1,padding:'12px',borderRadius:14,fontWeight:700,fontSize:14,cursor:'pointer',border:`1px solid ${lk?'rgba(236,72,153,.3)':'transparent'}`,
              background:lk?'rgba(236,72,153,.2)':'linear-gradient(135deg,#8B5CF6,#EC4899)',color:lk?'#F9A8D4':'#fff'}}>
            {lk?'✓ Interested':'❤️ I\'m Interested'} · {ev.interested}
          </button>
          <button onClick={()=>notify('📤 Link copied to clipboard!')} className="bp glass"
            style={{padding:'12px 18px',borderRadius:14,fontWeight:500,fontSize:14,border:'none',cursor:'pointer',color:'rgba(240,240,245,.7)'}}>Share</button>
        </div>
      </div>
    </div>
  </div>;
}

// ─── SEARCH ───────────────────────────────────────────────────────────────────
function Search(){
  const{nav}=useApp();const[q,setQ]=useState('');const iRef=useRef(null);
  useEffect(()=>{iRef.current?.focus();},[]);
  const ql=q.toLowerCase().trim();
  const res=ql?{
    songs:SONGS.filter(s=>s.title.toLowerCase().includes(ql)||s.artist.toLowerCase().includes(ql)||s.genre.toLowerCase().includes(ql)).slice(0,6),
    playlists:PLAYLISTS.filter(p=>p.name.toLowerCase().includes(ql)||p.desc.toLowerCase().includes(ql)).slice(0,4),
    events:EVENTS.filter(e=>e.name.toLowerCase().includes(ql)||e.type.toLowerCase().includes(ql)).slice(0,3),
    artists:ARTISTS.filter(a=>a.name.toLowerCase().includes(ql)||a.genre.toLowerCase().includes(ql)).slice(0,4),
  }:null;
  const hasRes=res&&Object.values(res).some(r=>r.length>0);
  const cats=[{l:'Bollywood',e:'🎬',c:'#EF4444'},{l:'Punjabi',e:'🎵',c:'#F59E0B'},{l:'Indie',e:'🎸',c:'#8B5CF6'},{l:'Lo-Fi',e:'☕',c:'#10B981'},{l:'EDM',e:'⚡',c:'#3B82F6'},{l:'Hip-Hop',e:'🎤',c:'#EC4899'},{l:'Rock',e:'🤘',c:'#EF4444'},{l:'Classical',e:'🎻',c:'#F97316'}];
  return<div style={{display:'flex',flexDirection:'column',gap:22}}>
    <h1 style={{fontFamily:"'Bricolage Grotesque',sans-serif",fontWeight:800,fontSize:'2rem'}}>🔍 Search</h1>
    <div style={{position:'relative'}}>
      <div style={{position:'absolute',left:15,top:'50%',transform:'translateY(-50%)',color:'rgba(240,240,245,.36)',pointerEvents:'none'}}>
        <svg width={18} height={18} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </div>
      <input ref={iRef} type="text" placeholder="Songs, artists, playlists, events..." value={q} onChange={e=>setQ(e.target.value)} aria-label="Search" style={{paddingLeft:46}}/>
      {q&&<button onClick={()=>setQ('')} style={{position:'absolute',right:13,top:'50%',transform:'translateY(-50%)',fontSize:20,color:'rgba(240,240,245,.38)',background:'none',border:'none',cursor:'pointer'}} aria-label="Clear">×</button>}
    </div>
    {ql&&res&&<div className="afd" style={{display:'flex',flexDirection:'column',gap:22}}>
      {!hasRes&&<div style={{textAlign:'center',padding:'55px 0',color:'rgba(240,240,245,.38)'}}>
        <div style={{fontSize:46}}>🎵</div><p style={{marginTop:11}}>No results for "{q}"</p>
      </div>}
      {res.songs.length>0&&<div>
        <SecHdr title="Songs"/>
        <div className="glass" style={{borderRadius:20,padding:'8px 4px'}}>{res.songs.map((s,i)=><SongRow key={s.id} song={s} idx={i} arr={res.songs}/>)}</div>
      </div>}
      {res.artists.length>0&&<div><SecHdr title="Artists"/><HScroll>{res.artists.map(a=><ArCard key={a.id} artist={a}/>)}</HScroll></div>}
      {res.playlists.length>0&&<div>
        <SecHdr title="Playlists"/>
        <div style={{display:'flex',flexDirection:'column',gap:9}}>
          {res.playlists.map(pl=><div key={pl.id} className="glass chov" style={{borderRadius:17,padding:11,display:'flex',alignItems:'center',gap:13,cursor:'pointer'}} onClick={()=>nav('playlist-detail',{pid:pl.id})}>
            <div style={{width:50,height:50,borderRadius:10,overflow:'hidden',flexShrink:0}}><Img src={pl.cover} alt={pl.name}/></div>
            <div><div style={{fontWeight:600,fontSize:14}}>{pl.em} {pl.name}</div><div style={{fontSize:12,color:'rgba(240,240,245,.38)',marginTop:2}}>{pl.songs.length} songs</div></div>
          </div>)}
        </div>
      </div>}
      {res.events.length>0&&<div>
        <SecHdr title="Events"/>
        <div style={{display:'flex',flexDirection:'column',gap:9}}>
          {res.events.map(ev=><div key={ev.id} className="glass chov" style={{borderRadius:17,padding:11,display:'flex',alignItems:'center',gap:13,cursor:'pointer'}} onClick={()=>nav('event-detail',{eid:ev.id})}>
            <div style={{width:50,height:50,borderRadius:10,overflow:'hidden',flexShrink:0}}><Img src={ev.cover} alt={ev.name}/></div>
            <div><div style={{fontWeight:600,fontSize:14}}>{ev.name}</div><div style={{fontSize:12,color:'rgba(240,240,245,.38)',marginTop:2}}>📍 {ev.venue}</div></div>
          </div>)}
        </div>
      </div>}
    </div>}
    {!ql&&<div>
      <SecHdr title="Browse Categories"/>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(145px,1fr))',gap:11}}>
        {cats.map(c=><button key={c.l} onClick={()=>setQ(c.l)} className="bp chov"
          style={{borderRadius:18,padding:'18px 15px',textAlign:'left',fontWeight:600,fontSize:14,border:`1px solid ${c.c}18`,cursor:'pointer',
            background:`linear-gradient(135deg,${c.c}30,${c.c}18)`,color:'#f0f0f5'}}>
          <div style={{fontSize:26,marginBottom:7}}>{c.e}</div>{c.l}
        </button>)}
      </div>
    </div>}
  </div>;
}

// ─── FAVORITES ────────────────────────────────────────────────────────────────
function Favorites(){
  const{liked,nav}=useApp();const[tab,setTab]=useState('songs');
  const lkS=liked.songs.map(id=>SONGS.find(s=>s.id===id)).filter(Boolean);
  const lkP=liked.playlists.map(id=>PLAYLISTS.find(p=>p.id===id)).filter(Boolean);
  const lkE=liked.events.map(id=>EVENTS.find(e=>e.id===id)).filter(Boolean);
  const lkA=liked.artists.map(id=>ARTISTS.find(a=>a.id===id)).filter(Boolean);
  const tabs=[{id:'songs',l:'Songs',n:lkS.length},{id:'playlists',l:'Playlists',n:lkP.length},{id:'events',l:'Events',n:lkE.length},{id:'artists',l:'Artists',n:lkA.length}];
  const Empty=({e,msg,act,onAct})=><div style={{textAlign:'center',padding:'65px 0'}}>
    <div style={{fontSize:50}}>{e}</div>
    <p style={{marginTop:13,color:'rgba(240,240,245,.42)',fontSize:15}}>{msg}</p>
    {act&&<button onClick={onAct} className="glass bp" style={{marginTop:14,padding:'9px 22px',borderRadius:12,fontSize:14,border:'none',cursor:'pointer'}}>{act}</button>}
  </div>;
  return<div style={{display:'flex',flexDirection:'column',gap:22}}>
    <h1 style={{fontFamily:"'Bricolage Grotesque',sans-serif",fontWeight:800,fontSize:'2rem'}}>❤️ Favorites</h1>
    <div className="glass" style={{padding:4,borderRadius:14,display:'inline-flex',gap:2}}>
      {tabs.map(t=><button key={t.id} onClick={()=>setTab(t.id)}
        style={{padding:'8px 17px',borderRadius:10,fontSize:13,fontWeight:500,cursor:'pointer',border:'none',display:'flex',alignItems:'center',gap:5,transition:'all .2s',
          background:tab===t.id?'rgba(255,255,255,.1)':'transparent',color:tab===t.id?'#f0f0f5':'rgba(240,240,245,.42)'}}>
        {t.l}{t.n>0&&<span style={{fontSize:11,padding:'2px 6px',borderRadius:100,background:'rgba(139,92,246,.25)',color:'#A78BFA'}}>{t.n}</span>}
      </button>)}
    </div>
    {tab==='songs'&&(lkS.length>0?<div className="glass" style={{borderRadius:20,padding:'8px 4px'}}>{lkS.map((s,i)=><SongRow key={s.id} song={s} idx={i} arr={lkS}/>)}</div>:<Empty e="🎵" msg="No liked songs yet. Heart a song to save it here." act="Discover music" onAct={()=>nav('trending')}/>)}
    {tab==='playlists'&&(lkP.length>0?<div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(174px,1fr))',gap:18}}>{lkP.map(pl=><PlCard key={pl.id} pl={pl} onClick={()=>nav('playlist-detail',{pid:pl.id})}/>)}</div>:<Empty e="📋" msg="No liked playlists yet." act="Browse playlists" onAct={()=>nav('playlists')}/>)}
    {tab==='events'&&(lkE.length>0?<div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(278px,1fr))',gap:14}}>{lkE.map(ev=><EvCard key={ev.id} ev={ev} onClick={()=>nav('event-detail',{eid:ev.id})}/>)}</div>:<Empty e="🎉" msg="No events saved yet." act="Browse events" onAct={()=>nav('events')}/>)}
    {tab==='artists'&&(lkA.length>0?<HScroll>{lkA.map(a=><ArCard key={a.id} artist={a}/>)}</HScroll>:<Empty e="🎤" msg="No favorite artists yet." act="Browse artists" onAct={()=>nav('trending')}/>)}
  </div>;
}

// ─── PROFILE ──────────────────────────────────────────────────────────────────
function Profile(){
  const{user,liked,recent,nav,set}=useApp();
  const campus=CAMPUSES.find(c=>c.id===user?.campus);
  const recS=recent.map(id=>SONGS.find(s=>s.id===id)).filter(Boolean).slice(0,5);
  const favP=liked.playlists.map(id=>PLAYLISTS.find(p=>p.id===id)).filter(Boolean).slice(0,3);
  const logout=()=>{
    if(window.confirm('Reset your GBMB profile?')){
      localStorage.removeItem('gbmb3');
      set(()=>({user:null,page:'landing',params:{},obStep:0,obData:{name:'',campus:'',mood:'',genres:[]},song:SONGS[0],playing:false,progress:0,volume:.7,liked:{songs:[],playlists:[],events:[],artists:[]},recent:[3,8,12,1,5],queue:[1,2,3,4,5],showQ:false,notif:null}));
    }
  };
  return<div style={{display:'flex',flexDirection:'column',gap:22}}>
    <div style={{borderRadius:24,padding:'26px 22px',background:'linear-gradient(135deg,rgba(139,92,246,.16),rgba(236,72,153,.1))',border:'1px solid rgba(139,92,246,.14)'}}>
      <div style={{display:'flex',alignItems:'center',gap:18,flexWrap:'wrap'}}>
        <div style={{width:78,height:78,borderRadius:'50%',background:'linear-gradient(135deg,#8B5CF6,#EC4899)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:30,fontWeight:800,flexShrink:0}}>
          {user?.name?.charAt(0)?.toUpperCase()}
        </div>
        <div>
          <h1 style={{fontFamily:"'Bricolage Grotesque',sans-serif",fontWeight:800,fontSize:'1.65rem'}}>{user?.name}</h1>
          <div style={{fontSize:14,color:'rgba(240,240,245,.48)',marginTop:4}}>🏫 {campus?.name}</div>
          <div style={{fontSize:14,color:'rgba(240,240,245,.48)',marginTop:2}}>🎭 Vibe: {ME[user?.mood]} {user?.mood}</div>
          <div style={{display:'flex',flexWrap:'wrap',gap:5,marginTop:9}}>
            {user?.genres?.map(g=><span key={g} className="tag" style={{background:'rgba(139,92,246,.2)',color:'#A78BFA'}}>{g}</span>)}
          </div>
        </div>
      </div>
    </div>
    <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:11}}>
      {[['🎵','Liked Songs',liked.songs.length],['📋','Playlists',liked.playlists.length],['🎉','Events',liked.events.length]].map(([e,l,n])=><div key={l} className="glass" style={{borderRadius:18,padding:'16px 12px',textAlign:'center'}}>
        <div style={{fontSize:22}}>{e}</div>
        <div className="gt" style={{fontFamily:"'Bricolage Grotesque',sans-serif",fontWeight:700,fontSize:'1.55rem',marginTop:3}}>{n}</div>
        <div style={{fontSize:12,color:'rgba(240,240,245,.36)',marginTop:3}}>{l}</div>
      </div>)}
    </div>
    {recS.length>0&&<div>
      <SecHdr title="Recently Played"/>
      <div className="glass" style={{borderRadius:20,padding:'8px 4px'}}>{recS.map((s,i)=><SongRow key={s.id} song={s} idx={i} arr={recS}/>)}</div>
    </div>}
    {favP.length>0&&<div>
      <SecHdr title="Favorite Playlists"/>
      <HScroll>{favP.map(pl=><PlCard key={pl.id} pl={pl} onClick={()=>nav('playlist-detail',{pid:pl.id})}/>)}</HScroll>
    </div>}
    <div className="glass" style={{borderRadius:20,padding:'14px 10px'}}>
      <div style={{fontSize:11,color:'rgba(240,240,245,.32)',padding:'0 10px 9px',letterSpacing:1.5,textTransform:'uppercase'}}>Quick Actions</div>
      {[{l:'🎭 Change Mood',a:()=>nav('mood')},{l:'🔍 Search Music',a:()=>nav('search')},{l:'📅 Campus Events',a:()=>nav('events')},{l:'❤️ My Favorites',a:()=>nav('favorites')}].map(item=><button key={item.l} onClick={item.a}
        style={{width:'100%',textAlign:'left',padding:'10px 12px',borderRadius:12,fontSize:14,fontWeight:500,background:'transparent',border:'none',color:'rgba(240,240,245,.72)',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'space-between',transition:'background .18s'}}
        onMouseEnter={e=>e.currentTarget.style.background='rgba(255,255,255,.05)'} onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
        {item.l}<span style={{color:'rgba(240,240,245,.22)',fontSize:16}}>›</span>
      </button>)}
      <div style={{borderTop:'1px solid rgba(255,255,255,.06)',marginTop:7,paddingTop:7}}>
        <button onClick={logout} style={{width:'100%',textAlign:'left',padding:'10px 12px',borderRadius:12,fontSize:14,fontWeight:500,background:'transparent',border:'none',color:'#F87171',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'space-between',transition:'background .18s'}}
          onMouseEnter={e=>e.currentTarget.style.background='rgba(239,68,68,.1)'} onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
          🚪 Reset Profile<span style={{color:'rgba(248,113,113,.28)',fontSize:16}}>›</span>
        </button>
      </div>
    </div>
  </div>;
}

// ─── APP ──────────────────────────────────────────────────────────────────────
function AppContent(){
  const{user,page,params}=useApp();
  if(!user&&page==='landing')return<Landing/>;
  if(!user||page==='onboarding')return<Onboarding/>;
  const render=()=>{
    switch(page){
      case 'home':return<Home/>;
      case 'trending':return<Trending/>;
      case 'mood':return<MoodPage/>;
      case 'playlists':return<Playlists/>;
      case 'playlist-detail':return<PlaylistDetail pid={params.pid}/>;
      case 'events':return<Events/>;
      case 'event-detail':return<EventDetail eid={params.eid}/>;
      case 'search':return<Search/>;
      case 'favorites':return<Favorites/>;
      case 'profile':return<Profile/>;
      default:return<Home/>;
    }
  };
  return<div style={{minHeight:'100vh'}}>
    <Sidebar/>
    <div style={{paddingBottom:160}} className="lg:pl-60">
      <main style={{maxWidth:952,margin:'0 auto',padding:'30px 18px'}} className="asc">{render()}</main>
    </div>
    <BottomNav/>
    <Player/>
    <Notif/>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<AppProvider><AppContent/></AppProvider>);
</script>
</body>
</html>
